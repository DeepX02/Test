table:
  name: notifications
  schema: public
object_relationships:
  - name: org
    using:
      foreign_key_constraint_on: org_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - org_id
        - workflow_run_id
        - step_run_id
        - channel
        - to_address
        - title
        - message
        - status
        - sent_at
        - created_at
        - updated_at
      filter:
        org:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: X-Hasura-Org-Role
      allow_aggregations: true
event_triggers:
  - name: notification_delivery
    definition:
      enable_manual: false
      insert:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 3
      timeout_sec: 30
    webhook: '{{NHOST_FUNCTIONS_URL}}/events/notifyHandler'
    headers:
      - name: nhost-webhook-secret
        value_from_env: NHOST_WEBHOOK_SECRET
    cleanup_config:
      batch_size: 10000
      clean_invocation_logs: true
      clear_older_than: 168
      paused: false
      schedule: 0 0 * * *
      timeout: 60
